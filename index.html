<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solana World</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050508;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}

#space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #11101b 0%, #07070b 45%, #030304 100%);
    cursor: grab;
}

#space.dragging {
    cursor: grabbing;
}

#world {
    position: absolute;
    width: 3000px;
    height: 3000px;
    left: 50%;
    top: 50%;
    transform-origin: center center;
}

#connections {
    position: absolute;
    inset: 0;
    width: 3000px;
    height: 3000px;
    pointer-events: none;
}

#worldNodes {
    position: absolute;
    inset: 0;
}

.node {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    cursor: pointer;
    user-select: none;
}

.wallet {
    width: 14px;
    height: 14px;
    background: #9945ff;
    box-shadow:
        0 0 10px #9945ff,
        0 0 25px rgba(153,69,255,.7);
}

.wallet::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    left: 5px;
    top: 5px;
}

.tx {
    width: 9px;
    height: 9px;
    background: #ff9d38;
    box-shadow:
        0 0 8px #ff9d38,
        0 0 18px rgba(255,157,56,.7);
}

.wallet-label {
    position: absolute;
    left: 20px;
    top: -4px;
    color: rgba(255,255,255,.55);
    font-size: 10px;
    white-space: nowrap;
    pointer-events: none;
}

header {
    position: fixed;
    z-index: 20;
    top: 20px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

.logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 3px;
}

.subtitle {
    margin-top: 5px;
    color: #777;
    font-size: 10px;
    letter-spacing: 2px;
}

.status {
    text-align: right;
    font-size: 11px;
    color: #aaa;
    line-height: 1.8;
}

.status span {
    color: #fff;
}

.live {
    color: #39ff88 !important;
}

#feed {
    position: fixed;
    z-index: 20;
    left: 24px;
    bottom: 24px;
    width: 330px;
    max-height: 180px;
    overflow: hidden;
    pointer-events: none;
}

.feed-title {
    color: #666;
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.feed-item {
    color: #aaa;
    font-size: 10px;
    margin-top: 6px;
    opacity: .9;
}

.feed-item strong {
    color: #fff;
}

#panel {
    position: fixed;
    z-index: 30;
    right: 24px;
    bottom: 24px;
    width: 280px;
    padding: 18px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(5,5,8,.82);
    backdrop-filter: blur(12px);
    display: none;
}

#panel h3 {
    margin: 0 0 10px;
    font-size: 12px;
    letter-spacing: 1px;
}

#panel .address {
    color: #9945ff;
    font-size: 10px;
    word-break: break-all;
}

#panel .info {
    margin-top: 12px;
    color: #888;
    font-size: 10px;
    line-height: 1.7;
}

#hint {
    position: fixed;
    z-index: 20;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.3);
    font-size: 9px;
    letter-spacing: 1px;
    pointer-events: none;
}

.pulse {
    animation: pulse 1.4s ease-out;
}

@keyframes pulse {
    0% {
        transform: translate(-50%, -50%) scale(.5);
        opacity: 0;
    }

    40% {
        opacity: 1;
    }

    100% {
        transform: translate(-50%, -50%) scale(2.5);
        opacity: 0;
    }
}

@media (max-width: 600px) {
    header {
        top: 14px;
        left: 15px;
        right: 15px;
    }

    .logo {
        font-size: 15px;
    }

    .status {
        font-size: 9px;
    }

    #feed {
        left: 15px;
        bottom: 15px;
        width: 220px;
    }

    #panel {
        right: 15px;
        bottom: 15px;
        width: 240px;
    }

    #hint {
        display: none;
    }
}
</style>
</head>

<body>

<div id="space">

    <header>
        <div>
            <div class="logo">SOLANA WORLD</div>
            <div class="subtitle">THE BLOCKCHAIN, ALIVE.</div>
        </div>

        <div class="status">
            <div><span class="live">● LIVE NETWORK</span></div>
            <div>REAL WALLETS: <span id="walletCount">0</span></div>
            <div>REAL TX: <span id="txCount">0</span></div>
        </div>
    </header>

    <div id="world">
        <canvas id="connections" width="3000" height="3000"></canvas>
        <div id="worldNodes"></div>
    </div>

    <div id="feed">
        <div class="feed-title">LIVE ACTIVITY</div>
    </div>

    <div id="panel">
        <h3>WALLET</h3>
        <div class="address" id="panelAddress"></div>
        <div class="info" id="panelInfo"></div>
    </div>

    <div id="hint">
        DRAG TO MOVE · PINCH / SCROLL TO ZOOM
    </div>

</div>

<script>
const space = document.getElementById("space");
const world = document.getElementById("world");
const worldNodes = document.getElementById("worldNodes");
const canvas = document.getElementById("connections");
const ctx = canvas.getContext("2d");

const walletCount = document.getElementById("walletCount");
const txCount = document.getElementById("txCount");

const feed = document.getElementById("feed");
const panel = document.getElementById("panel");
const panelAddress = document.getElementById("panelAddress");
const panelInfo = document.getElementById("panelInfo");

const WORLD_SIZE = 3000;
const CENTER = WORLD_SIZE / 2;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
let startOffsetX = 0;
let startOffsetY = 0;

let lastTouchDistance = null;
let lastTouchCenter = null;

const MIN_SCALE = 0.35;
const MAX_SCALE = 3.5;

const walletMap = new Map();
const transactions = [];

function applyTransform() {
    world.style.transform =
        `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) scale(${scale})`;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function zoomAt(clientX, clientY, newScale) {
    newScale = clamp(newScale, MIN_SCALE, MAX_SCALE);

    const rect = space.getBoundingClientRect();

    const mouseX = clientX - rect.left - rect.width / 2;
    const mouseY = clientY - rect.top - rect.height / 2;

    const worldX = (mouseX - offsetX) / scale;
    const worldY = (mouseY - offsetY) / scale;

    offsetX = mouseX - worldX * newScale;
    offsetY = mouseY - worldY * newScale;

    scale = newScale;

    applyTransform();
}

/* =========================
   MOUSE DRAG
========================= */

space.addEventListener("mousedown", e => {
    if (e.button !== 0) return;

    dragging = true;
    space.classList.add("dragging");

    dragStartX = e.clientX;
    dragStartY = e.clientY;

    startOffsetX = offsetX;
    startOffsetY = offsetY;
});

window.addEventListener("mousemove", e => {
    if (!dragging) return;

    offsetX = startOffsetX + (e.clientX - dragStartX);
    offsetY = startOffsetY + (e.clientY - dragStartY);

    applyTransform();
});

window.addEventListener("mouseup", () => {
    dragging = false;
    space.classList.remove("dragging");
});

/* =========================
   MOUSE WHEEL ZOOM
========================= */

space.addEventListener("wheel", e => {
    e.preventDefault();

    const direction = e.deltaY > 0 ? 0.9 : 1.1;

    zoomAt(
        e.clientX,
        e.clientY,
        scale * direction
    );
}, { passive: false });

/* =========================
   TOUCH DRAG + PINCH ZOOM
========================= */

function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;

    return Math.sqrt(dx * dx + dy * dy);
}

function getTouchCenter(touches) {
    return {
        x: (touches[0].clientX + touches[1].clientX) / 2,
        y: (touches[0].clientY + touches[1].clientY) / 2
    };
}

space.addEventListener("touchstart", e => {
    e.preventDefault();

    if (e.touches.length === 1) {
        dragging = true;

        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;

        startOffsetX = offsetX;
        startOffsetY = offsetY;
    }

    if (e.touches.length === 2) {
        dragging = false;

        lastTouchDistance = getTouchDistance(e.touches);
        lastTouchCenter = getTouchCenter(e.touches);
    }
}, { passive: false });

space.addEventListener("touchmove", e => {
    e.preventDefault();

    /* ONE FINGER = DRAG */

    if (e.touches.length === 1 && dragging) {
        offsetX =
            startOffsetX +
            (e.touches[0].clientX - dragStartX);

        offsetY =
            startOffsetY +
            (e.touches[0].clientY - dragStartY);

        applyTransform();
    }

    /* TWO FINGERS = PINCH + MOVE */

    if (e.touches.length === 2) {

        const newDistance = getTouchDistance(e.touches);
        const center = getTouchCenter(e.touches);

        if (lastTouchDistance !== null) {

            const zoomFactor =
                newDistance / lastTouchDistance;

            const newScale =
                clamp(scale * zoomFactor, MIN_SCALE, MAX_SCALE);

            zoomAt(
                center.x,
                center.y,
                newScale
            );
        }

        if (lastTouchCenter !== null) {
            offsetX += center.x - lastTouchCenter.x;
            offsetY += center.y - lastTouchCenter.y;

            applyTransform();
        }

        lastTouchDistance = newDistance;
        lastTouchCenter = center;
    }

}, { passive: false });

space.addEventListener("touchend", e => {

    if (e.touches.length === 0) {
        dragging = false;
        lastTouchDistance = null;
        lastTouchCenter = null;
    }

    if (e.touches.length === 1) {
        dragging = true;

        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;

        startOffsetX = offsetX;
        startOffsetY = offsetY;

        lastTouchDistance = null;
        lastTouchCenter = null;
    }

}, { passive: false });

/* =========================
   WALLET
========================= */

function shorten(address) {
    if (!address) return "";
    return address.slice(0, 5) + "..." + address.slice(-4);
}

function createWallet(address) {

    if (walletMap.has(address)) {
        return walletMap.get(address);
    }

    const angle =
        Math.random() * Math.PI * 2;

    const radius =
        250 + Math.random() * 850;

    const x =
        CENTER + Math.cos(angle) * radius;

    const y =
        CENTER + Math.sin(angle) * radius;

    const node = document.createElement("div");

    node.className = "node wallet";
    node.style.left = x + "px";
    node.style.top = y + "px";

    const label = document.createElement("div");

    label.className = "wallet-label";
    label.textContent = shorten(address);

    node.appendChild(label);

    node.addEventListener("click", e => {
        e.stopPropagation();

        panel.style.display = "block";

        panelAddress.textContent = address;

        panelInfo.innerHTML =
            "STATUS: ACTIVE<br>" +
            "TYPE: ON-CHAIN ACCOUNT<br>" +
            "SOURCE: SOLANA MAINNET";
    });

    worldNodes.appendChild(node);

    const wallet = {
        address,
        x,
        y,
        node
    };

    walletMap.set(address, wallet);

    return wallet;
}

/* =========================
   TRANSACTION
========================= */

function createTransaction(tx) {

    const wallets = tx.wallets || [];

    if (wallets.length < 2) return;

    const walletA = createWallet(wallets[0]);
    const walletB = createWallet(wallets[1]);

    const x =
        (walletA.x + walletB.x) / 2;

    const y =
        (walletA.y + walletB.y) / 2;

    const node = document.createElement("div");

    node.className = "node tx";
    node.style.left = x + "px";
    node.style.top = y + "px";

    node.title = tx.signature;

    worldNodes.appendChild(node);

    transactions.push({
        walletA,
        walletB,
        node,
        signature: tx.signature
    });

    addFeed(tx.signature);

    node.classList.add("pulse");

    setTimeout(() => {
        node.classList.remove("pulse");
    }, 1500);
}

/* =========================
   CONNECTIONS
========================= */

function drawConnections() {

    ctx.clearRect(
        0,
        0,
        WORLD_SIZE,
        WORLD_SIZE
    );

    ctx.lineWidth = 1;

    for (const tx of transactions) {

        const a = tx.walletA;
        const b = tx.walletB;

        ctx.beginPath();

        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);

        ctx.strokeStyle =
            "rgba(153,69,255,0.15)";

        ctx.stroke();
    }
}

/* =========================
   FEED
========================= */

function addFeed(signature) {

    const item =
        document.createElement("div");

    item.className = "feed-item";

    item.innerHTML =
        "<strong>TX</strong> " +
        shorten(signature);

    feed.appendChild(item);

    while (feed.children.length > 6) {
        feed.removeChild(feed.children[1]);
    }
}

/* =========================
   LOAD SOLANA
========================= */

async function loadSolana() {

    try {

        const response =
            await fetch("/api/solana");

        const data =
            await response.json();

        if (!data.success) {
            console.error(data);
            return;
        }

        const wallets =
            data.wallets || [];

        for (const address of wallets) {
            createWallet(address);
        }

        if (data.transactions) {

            for (const tx of data.transactions) {

                const exists =
                    transactions.some(
                        item =>
                            item.signature === tx.signature
                    );

                if (!exists) {
                    createTransaction(tx);
                }
            }
        }

        walletCount.textContent =
            walletMap.size;

        txCount.textContent =
            transactions.length;

        drawConnections();

    } catch (error) {

        console.error(
            "Solana API error:",
            error
        );
    }
}

/* =========================
   BACKGROUND CLICK
========================= */

space.addEventListener("click", () => {
    panel.style.display = "none";
});

/* =========================
   START
========================= */

applyTransform();

loadSolana();

setInterval(
    loadSolana,
    15000
);

</script>

</body>
</html>
