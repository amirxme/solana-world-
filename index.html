<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana World</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050509;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #world {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at center, #111125 0%, #050509 55%, #020203 100%);
    }

    .title {
      position: absolute;
      top: 25px;
      left: 30px;
      z-index: 10;
    }

    .title h1 {
      font-size: 24px;
      letter-spacing: 3px;
    }

    .title p {
      margin-top: 6px;
      color: #777;
      font-size: 12px;
    }

    .node {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      transition: 0.2s;
      box-shadow: 0 0 25px rgba(120, 80, 255, 0.35);
    }

    .node:hover {
      transform: scale(1.2);
    }

    .wallet {
      background: #302080;
    }

    .token {
      background: #146b65;
    }

    .tx {
      background: #8a5a16;
      width: 50px;
      height: 50px;
    }

    .line {
      position: absolute;
      height: 1px;
      background: rgba(130, 120, 255, 0.3);
      transform-origin: left center;
    }

    .panel {
      position: absolute;
      right: 25px;
      top: 25px;
      width: 280px;
      padding: 20px;
      background: rgba(12, 12, 20, 0.9);
      border: 1px solid #252538;
      border-radius: 14px;
      display: none;
      z-index: 20;
    }

    .panel h2 {
      margin-bottom: 10px;
    }

    .panel p {
      color: #888;
      font-size: 13px;
      line-height: 1.6;
    }

    .status {
      position: absolute;
      bottom: 20px;
      left: 25px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div id="world">

    <div class="title">
      <h1>SOLANA WORLD</h1>
      <p>Explore the blockchain as a living world.</p>
    </div>

    <div class="node wallet" style="left:20%; top:35%;" onclick="showNode('Wallet #01')">
      WALLET
    </div>

    <div class="node token" style="left:50%; top:25%;" onclick="showNode('$TOKEN')">
      $TOKEN
    </div>

    <div class="node wallet" style="left:70%; top:55%;" onclick="showNode('Wallet #02')">
      WALLET
    </div>

    <div class="node token" style="left:35%; top:65%;" onclick="showNode('$MEME')">
      $MEME
    </div>

    <div class="node tx" style="left:55%; top:50%;" onclick="showNode('Transaction')">
      TX
    </div>

    <div class="panel" id="panel">
      <h2 id="panelTitle"></h2>
      <p id="panelText"></p>
    </div>

    <div class="status">
      ● WORLD ONLINE
    </div>

  </div>

  <script>
    function showNode(name) {
      const panel = document.getElementById("panel");
      const title = document.getElementById("panelTitle");
      const text = document.getElementById("panelText");

      title.textContent = name;
      text.textContent =
        "This object represents an on-chain entity. In the full version, this space will contain live Solana data.";

      panel.style.display = "block";
    }
  </script>

</body>
</html>
