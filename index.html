<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Solana World</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020205;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#space{
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:none;
  cursor:grab;
}

#space.dragging{
  cursor:grabbing;
}

#world{
  position:absolute;
  width:4000px;
  height:3000px;
  left:50%;
  top:50%;
  transform-origin:center center;
}

#connections{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#worldNodes{
  position:absolute;
  inset:0;
}

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  padding:22px 24px;
  pointer-events:none;
}

.title{
  font-size:18px;
  font-weight:700;
  letter-spacing:5px;
}

.subtitle{
  margin-top:6px;
  font-size:10px;
  letter-spacing:3px;
  color:#777;
}

.network{
  position:fixed;
  top:22px;
  right:24px;
  font-size:10px;
  letter-spacing:2px;
  color:#aaa;
}

.network-pulse{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#62ff9b;
  margin-right:7px;
  box-shadow:0 0 12px #62ff9b;
}

.stats{
  position:fixed;
  top:65px;
  right:24px;
  z-index:50;
  text-align:right;
  font-size:9px;
  line-height:18px;
  color:#666;
  letter-spacing:1px;
  pointer-events:none;
}

.cluster{
  position:absolute;
  width:620px;
  height:420px;
  border:1px solid rgba(255,255,255,.055);
  border-radius:50%;
  pointer-events:none;
}

.cluster span{
  position:absolute;
  top:15px;
  left:20px;
  font-size:9px;
  letter-spacing:4px;
  color:#333;
}

#defi{left:350px;top:400px;}
#meme{left:1750px;top:300px;}
#trading{left:800px;top:1700px;}
#nft{left:2350px;top:1650px;}

.wallet{
  position:absolute;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 10px rgba(255,255,255,.8);
  transform:translate(-50%,-50%);
  cursor:pointer;
  z-index:5;
}

.wallet.real{
  width:15px;
  height:15px;
  background:#62ff9b;
  box-shadow:
    0 0 8px #62ff9b,
    0 0 22px rgba(98,255,155,.5);
}

.wallet:hover{
  transform:translate(-50%,-50%) scale(1.5);
}

.wallet-label{
  position:absolute;
  left:18px;
  top:-5px;
  white-space:nowrap;
  font-size:8px;
  color:#777;
  pointer-events:none;
}

.tx{
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#a77bff;
  box-shadow:0 0 12px rgba(167,123,255,.9);
  transform:translate(-50%,-50%);
  cursor:pointer;
  z-index:7;
}

.tx-label{
  position:absolute;
  left:13px;
  top:-5px;
  white-space:nowrap;
  font-size:8px;
  color:#765da8;
  pointer-events:none;
}

.particle{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 10px #fff;
  pointer-events:none;
  z-index:8;
}

#feed{
  position:fixed;
  left:20px;
  bottom:20px;
  width:300px;
  z-index:50;
  pointer-events:none;
}

.feed-title{
  font-size:9px;
  letter-spacing:3px;
  color:#444;
  margin-bottom:8px;
}

#feedItems{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.feed-item{
  font-size:9px;
  color:#777;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

#panel{
  position:fixed;
  right:20px;
  bottom:20px;
  width:320px;
  max-width:calc(100vw - 40px);
  min-height:180px;
  background:rgba(5,5,10,.92);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(12px);
  z-index:60;
  padding:18px;
  display:none;
}

.panel-title{
  font-size:9px;
  letter-spacing:3px;
  color:#666;
  margin-bottom:14px;
}

.panel-row{
  margin-bottom:12px;
}

.panel-label{
  font-size:8px;
  color:#555;
  letter-spacing:2px;
  margin-bottom:4px;
}

.panel-value{
  font-size:11px;
  color:#ddd;
  word-break:break-all;
}

.panel-close{
  position:absolute;
  right:14px;
  top:12px;
  color:#666;
  cursor:pointer;
  font-size:16px;
}

.solscan-link{
  display:inline-block;
  margin-top:12px;
  color:#62ff9b;
  font-size:9px;
  letter-spacing:2px;
  text-decoration:none;
}

.solscan-link:hover{
  text-decoration:underline;
}

.balance{
  color:#62ff9b;
  font-size:14px;
  font-weight:700;
}

@media(max-width:700px){
  header{
    padding:16px;
  }

  .title{
    font-size:14px;
    letter-spacing:3px;
  }

  .subtitle{
    font-size:8px;
  }

  .network{
    top:17px;
    right:16px;
    font-size:8px;
  }

  .stats{
    top:52px;
    right:16px;
    font-size:8px;
  }

  #feed{
    left:14px;
    bottom:14px;
    width:220px;
  }

  #panel{
    right:12px;
    left:12px;
    bottom:12px;
    width:auto;
  }
}
</style>
</head>

<body>

<div id="space">

  <div id="world">

    <canvas id="connections"></canvas>

    <div class="cluster" id="defi">
      <span>DEFI</span>
    </div>

    <div class="cluster" id="meme">
      <span>MEME</span>
    </div>

    <div class="cluster" id="trading">
      <span>TRADING</span>
    </div>

    <div class="cluster" id="nft">
      <span>NFT</span>
    </div>

    <div id="worldNodes"></div>

  </div>
</div>

<header>
  <div class="title">SOLANA WORLD</div>
  <div class="subtitle">THE BLOCKCHAIN, ALIVE.</div>
</header>

<div class="network">
  <span class="network-pulse"></span>
  <span id="activity">CONNECTING</span>
</div>

<div class="stats">
  WALLETS <span id="walletCount">0</span><br>
  TRANSACTIONS <span id="txCount">0</span>
</div>

<div id="feed">
  <div class="feed-title">LIVE ACTIVITY</div>
  <div id="feedItems"></div>
</div>

<div id="panel">
  <div class="panel-close" onclick="closePanel()">×</div>
  <div id="panelContent"></div>
</div>

<script>
const space = document.getElementById("space");
const world = document.getElementById("world");
const canvas = document.getElementById("connections");
const ctx = canvas.getContext("2d");

const worldNodes = document.getElementById("worldNodes");
const feedItems = document.getElementById("feedItems");

const activity = document.getElementById("activity");
const walletCount = document.getElementById("walletCount");
const txCount = document.getElementById("txCount");

const panel = document.getElementById("panel");
const panelContent = document.getElementById("panelContent");

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let dragging = false;
let startX = 0;
let startY = 0;
let startOffsetX = 0;
let startOffsetY = 0;

let touchDistance = 0;
let touchScale = 1;

const walletMap = new Map();

let solanaBalances = {};

const transactions = [];

function resizeCanvas(){
  canvas.width = world.clientWidth;
  canvas.height = world.clientHeight;
  drawConnections();
}

window.addEventListener("resize", resizeCanvas);

function updateWorldTransform(){
  world.style.transform =
    `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) scale(${scale})`;

  drawConnections();
}

function clampScale(value){
  return Math.max(.35, Math.min(3.5, value));
}

space.addEventListener("wheel", function(e){
  e.preventDefault();

  const rect = space.getBoundingClientRect();

  const mouseX = e.clientX - rect.left - rect.width / 2;
  const mouseY = e.clientY - rect.top - rect.height / 2;

  const oldScale = scale;
  const newScale = clampScale(
    scale * (e.deltaY < 0 ? 1.12 : 0.89)
  );

  const ratio = newScale / oldScale;

  offsetX = mouseX - (mouseX - offsetX) * ratio;
  offsetY = mouseY - (mouseY - offsetY) * ratio;

  scale = newScale;

  updateWorldTransform();
}, {passive:false});

space.addEventListener("mousedown", function(e){
  if(e.target.closest(".wallet,.tx,#panel")) return;

  dragging = true;
  space.classList.add("dragging");

  startX = e.clientX;
  startY = e.clientY;

  startOffsetX = offsetX;
  startOffsetY = offsetY;
});

window.addEventListener("mousemove", function(e){
  if(!dragging) return;

  offsetX = startOffsetX + e.clientX - startX;
  offsetY = startOffsetY + e.clientY - startY;

  updateWorldTransform();
});

window.addEventListener("mouseup", function(){
  dragging = false;
  space.classList.remove("dragging");
});

space.addEventListener("touchstart", function(e){
  if(e.target.closest(".wallet,.tx,#panel")) return;

  if(e.touches.length === 1){
    dragging = true;

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;

    startOffsetX = offsetX;
    startOffsetY = offsetY;
  }

  if(e.touches.length === 2){
    dragging = false;

    touchDistance = getTouchDistance(e.touches);
    touchScale = scale;
  }
}, {passive:false});

space.addEventListener("touchmove", function(e){
  e.preventDefault();

  if(e.touches.length === 1 && dragging){
    offsetX =
      startOffsetX +
      e.touches[0].clientX -
      startX;

    offsetY =
      startOffsetY +
      e.touches[0].clientY -
      startY;

    updateWorldTransform();
  }

  if(e.touches.length === 2){
    const distance = getTouchDistance(e.touches);

    if(touchDistance > 0){
      scale = clampScale(
        touchScale * (distance / touchDistance)
      );

      updateWorldTransform();
    }
  }
}, {passive:false});

space.addEventListener("touchend", function(e){
  if(e.touches.length === 0){
    dragging = false;
  }

  if(e.touches.length < 2){
    touchDistance = 0;
  }
}, {passive:false});

function getTouchDistance(touches){
  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.sqrt(dx * dx + dy * dy);
}

function randomPosition(){
  return {
    x: 500 + Math.random() * 3000,
    y: 350 + Math.random() * 2200
  };
}

function shortAddress(address){
  if(!address) return "UNKNOWN";

  return address.slice(0,5) +
    "..." +
    address.slice(-4);
}

function formatBalance(value){
  const num = Number(value || 0);

  if(num === 0) return "0 SOL";

  if(num < 0.000001){
    return num.toExponential(4) + " SOL";
  }

  return num.toLocaleString("en-US", {
    maximumFractionDigits:6
  }) + " SOL";
}

function createWallet(address){

  if(!address) return null;

  if(walletMap.has(address)){
    return walletMap.get(address);
  }

  const position = randomPosition();

  const el = document.createElement("div");

  el.className = "wallet real";

  el.style.left = position.x + "px";
  el.style.top = position.y + "px";

  const label = document.createElement("div");

  label.className = "wallet-label";
  label.textContent = shortAddress(address);

  el.appendChild(label);

  el.addEventListener("click", function(e){
    e.stopPropagation();
    openWallet(address);
  });

  worldNodes.appendChild(el);

  const wallet = {
    address,
    x: position.x,
    y: position.y,
    el
  };

  walletMap.set(address, wallet);

  return wallet;
}

function createTransaction(tx){

  const wallets =
    (tx.wallets || []).filter(Boolean);

  if(!wallets.length) return;

  const existing =
    transactions.find(
      item => item.signature === tx.signature
    );

  if(existing) return;

  const walletObjects =
    wallets.map(createWallet).filter(Boolean);

  if(!walletObjects.length) return;

  const first =
    walletObjects[0];

  const second =
    walletObjects[
      Math.min(1, walletObjects.length - 1)
    ];

  const x =
    (first.x + second.x) / 2;

  const y =
    (first.y + second.y) / 2;

  const el =
    document.createElement("div");

  el.className = "tx";

  el.style.left = x + "px";
  el.style.top = y + "px";

  const label =
    document.createElement("div");

  label.className = "tx-label";

  label.textContent =
    shortAddress(tx.signature);

  el.appendChild(label);

  el.addEventListener("click", function(e){
    e.stopPropagation();
    openTransaction(tx);
  });

  worldNodes.appendChild(el);

  const transaction = {
    signature: tx.signature,
    blockTime: tx.blockTime || null,
    wallets: walletObjects,
    el
  };

  transactions.push(transaction);

  animateTransaction(transaction);
  addFeed("TX " + shortAddress(tx.signature));
}

function animateTransaction(transaction){

  const wallets = transaction.wallets;

  if(wallets.length < 2) return;

  const from = wallets[0];
  const to = wallets[1];

  const particle =
    document.createElement("div");

  particle.className = "particle";

  worldNodes.appendChild(particle);

  let progress = 0;

  function move(){

    progress += 0.012;

    if(progress > 1){
      progress = 0;
    }

    const x =
      from.x +
      (to.x - from.x) *
      progress;

    const y =
      from.y +
      (to.y - from.y) *
      progress;

    particle.style.left = x + "px";
    particle.style.top = y + "px";

    requestAnimationFrame(move);
  }

  move();
}

function drawConnections(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.save();

  ctx.globalAlpha = .18;
  ctx.lineWidth = 1;

  transactions.forEach(tx => {

    const wallets = tx.wallets;

    if(wallets.length < 2) return;

    for(let i = 0; i < wallets.length - 1; i++){

      const a = wallets[i];
      const b = wallets[i + 1];

      ctx.beginPath();

      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);

      ctx.stroke();
    }
  });

  ctx.restore();
}

function getRelatedTx(address){

  return transactions.filter(tx =>
    tx.wallets.some(wallet =>
      wallet.address === address
    )
  );
}

function getLastActivity(address){

  const related =
    getRelatedTx(address);

  if(!related.length){
    return "NO DATA";
  }

  const latest =
    related[related.length - 1];

  if(!latest.blockTime){
    return "RECENT";
  }

  return new Date(
    latest.blockTime * 1000
  ).toLocaleString();
}

function openWallet(address){

  const related =
    getRelatedTx(address);

  const balance =
    solanaBalances[address] || 0;

  panelContent.innerHTML = `
    <div class="panel-title">WALLET</div>

    <div class="panel-row">
      <div class="panel-label">TYPE</div>
      <div class="panel-value">SOLANA ACCOUNT</div>
    </div>

    <div class="panel-row">
      <div class="panel-label">ADDRESS</div>
      <div class="panel-value">${address}</div>
    </div>

    <div class="panel-row">
      <div class="panel-label">SOL BALANCE</div>
      <div class="balance">${formatBalance(balance)}</div>
    </div>

    <div class="panel-row">
      <div class="panel-label">RELATED TX</div>
      <div class="panel-value">${related.length}</div>
    </div>

    <div class="panel-row">
      <div class="panel-label">LAST ACTIVITY</div>
      <div class="panel-value">${getLastActivity(address)}</div>
    </div>

    <a
      class="solscan-link"
      href="https://solscan.io/account/${address}"
      target="_blank"
      rel="noopener"
    >
      VIEW ON SOLSCAN →
    </a>
  `;

  panel.style.display = "block";
}

function openTransaction(tx){

  const blockTime =
    tx.blockTime
      ? new Date(
          tx.blockTime * 1000
        ).toLocaleString()
      : "UNKNOWN";

  panelContent.innerHTML = `
    <div class="panel-title">TRANSACTION</div>

    <div class="panel-row">
      <div class="panel-label">SIGNATURE</div>
      <div class="panel-value">${tx.signature}</div>
    </div>

    <div class="panel-row">
      <div class="panel-label">TIME</div>
      <div class="panel-value">${blockTime}</div>
    </div>

    <div class="panel-row">
      <div class="panel-label">WALLETS</div>
      <div class="panel-value">${tx.wallets.length}</div>
    </div>

    <a
      class="solscan-link"
      href="https://solscan.io/tx/${tx.signature}"
      target="_blank"
      rel="noopener"
    >
      VIEW TRANSACTION →
    </a>
  `;

  panel.style.display = "block";
}

function closePanel(){
  panel.style.display = "none";
}

space.addEventListener("click", function(e){

  if(
    e.target === space ||
    e.target === world ||
    e.target === worldNodes
  ){
    closePanel();
  }
});

function addFeed(text){

  const item =
    document.createElement("div");

  item.className = "feed-item";

  item.textContent = text;

  feedItems.prepend(item);

  while(feedItems.children.length > 7){
    feedItems.removeChild(
      feedItems.lastChild
    );
  }
}

async function loadSolana(){

  activity.textContent = "LOADING";

  try{

    const response =
      await fetch(
        "/api/solana",
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "API " + response.status
      );
    }

    const data =
      await response.json();

    if(!data.success){
      throw new Error("RPC ERROR");
    }

    solanaBalances =
      data.balances || {};

    const txs =
      data.transactions || [];

    txs.forEach(createTransaction);

    activity.textContent =
      txs.length + " LIVE TX";

    walletCount.textContent =
      walletMap.size;

    txCount.textContent =
      transactions.length;

    drawConnections();

  }catch(error){

    console.error(
      "SOLANA WORLD ERROR:",
      error
    );

    activity.textContent = "ERROR";

    addFeed(
      "RPC CONNECTION ERROR"
    );
  }
}

resizeCanvas();

updateWorldTransform();

loadSolana();

setInterval(
  loadSolana,
  15000
);
</script>

</body>
</html>
