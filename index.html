<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Solana World</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030306;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

#space{
  position:absolute;
  inset:0;
  cursor:grab;
  transform-origin:center center;
}

#space.dragging{cursor:grabbing}

#world{
  position:absolute;
  width:1800px;
  height:1100px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

#connections{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

header{
  position:fixed;
  top:25px;
  left:28px;
  z-index:100;
  pointer-events:none;
}

.logo{
  font-size:19px;
  font-weight:800;
  letter-spacing:4px;
}

.subtitle{
  margin-top:6px;
  font-size:10px;
  letter-spacing:3px;
  color:#777;
}

.live{
  margin-top:13px;
  font-size:9px;
  letter-spacing:2px;
  color:#52ff91;
}

.live:before{
  content:"";
  display:inline-block;
  width:6px;
  height:6px;
  margin-right:7px;
  border-radius:50%;
  background:#52ff91;
  box-shadow:0 0 10px #52ff91;
}

#network{
  position:fixed;
  right:28px;
  top:25px;
  z-index:100;
  text-align:right;
  font-size:9px;
  line-height:1.9;
  letter-spacing:2px;
  color:#777;
  pointer-events:none;
}

#network span{color:#ddd}

#worldNodes{
  position:absolute;
  inset:0;
}

.wallet{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#a56bff;
  box-shadow:
    0 0 12px rgba(165,107,255,.9),
    0 0 35px rgba(165,107,255,.35);
  cursor:pointer;
  z-index:10;
  transition:transform .2s;
}

.wallet:hover{
  transform:scale(2);
}

.wallet.real{
  width:13px;
  height:13px;
  background:#b16cff;
  box-shadow:
    0 0 15px rgba(177,108,255,1),
    0 0 45px rgba(177,108,255,.4);
}

.wallet-label{
  position:absolute;
  left:17px;
  top:-3px;
  white-space:nowrap;
  font-size:7px;
  letter-spacing:1px;
  color:rgba(210,185,255,.7);
  pointer-events:none;
}

.tx{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff9d42;
  box-shadow:
    0 0 14px #ff9d42,
    0 0 35px rgba(255,157,66,.45);
  z-index:15;
  animation:txPulse 1.5s infinite;
  cursor:pointer;
}

@keyframes txPulse{
  0%,100%{transform:scale(.8);opacity:.65}
  50%{transform:scale(1.7);opacity:1}
}

.tx-label{
  position:absolute;
  left:13px;
  top:-5px;
  white-space:nowrap;
  color:rgba(255,180,110,.8);
  font-size:7px;
  letter-spacing:1px;
}

.cluster{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  opacity:.3;
}

.defi{
  width:430px;
  height:430px;
  left:100px;
  top:150px;
  background:radial-gradient(circle,rgba(123,77,255,.18),transparent 68%);
}

.meme{
  width:380px;
  height:380px;
  right:150px;
  top:100px;
  background:radial-gradient(circle,rgba(255,73,177,.13),transparent 68%);
}

.trading{
  width:420px;
  height:420px;
  left:650px;
  bottom:60px;
  background:radial-gradient(circle,rgba(0,183,255,.12),transparent 68%);
}

.nft{
  width:350px;
  height:350px;
  right:50px;
  bottom:90px;
  background:radial-gradient(circle,rgba(68,255,153,.1),transparent 68%);
}

.zone{
  position:absolute;
  font-size:8px;
  letter-spacing:3px;
  color:rgba(255,255,255,.2);
}

#feed{
  position:fixed;
  left:28px;
  bottom:25px;
  width:310px;
  z-index:100;
  pointer-events:none;
}

.feed-title{
  font-size:8px;
  letter-spacing:3px;
  color:#666;
  margin-bottom:8px;
}

.feed-item{
  font-size:9px;
  color:#aaa;
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.feed-item.real{
  color:#ddd;
}

.feed-item.real:before{
  content:"● ";
  color:#ff9d42;
}

#panel{
  position:fixed;
  right:28px;
  bottom:25px;
  width:310px;
  padding:18px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(7,7,12,.9);
  backdrop-filter:blur(14px);
  z-index:200;
  display:none;
}

.panel-title{
  font-size:8px;
  color:#777;
  letter-spacing:3px;
  margin-bottom:12px;
}

.panel-content{
  font-size:9px;
  color:#ddd;
  line-height:1.7;
  word-break:break-all;
}

.network-pulse{
  position:absolute;
  width:30px;
  height:30px;
  border:1px solid rgba(165,107,255,.6);
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:pulse 2.5s forwards;
  pointer-events:none;
}

@keyframes pulse{
  0%{
    opacity:.8;
    transform:translate(-50%,-50%) scale(.2);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(8);
  }
}

#status{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  color:#555;
  font-size:8px;
  letter-spacing:2px;
  z-index:100;
  pointer-events:none;
}

@media(max-width:700px){
  header{top:17px;left:18px}
  #network{top:17px;right:18px}
  #feed{left:18px;bottom:18px;width:240px}
  #panel{right:18px;bottom:18px;width:260px}
  #status{display:none}
}
</style>
</head>

<body>

<header>
  <div class="logo">SOLANA WORLD</div>
  <div class="subtitle">THE BLOCKCHAIN, ALIVE.</div>
  <div class="live">LIVE NETWORK</div>
</header>

<div id="network">
  NETWORK: <span>SOLANA</span><br>
  ACTIVITY: <span id="activity">CONNECTING</span><br>
  REAL WALLETS: <span id="walletCount">0</span><br>
  REAL TX: <span id="txCount">0</span>
</div>

<div id="space">

  <div id="world">

    <canvas id="connections"></canvas>

    <div class="cluster defi"></div>
    <div class="cluster meme"></div>
    <div class="cluster trading"></div>
    <div class="cluster nft"></div>

    <div class="zone" style="left:250px;top:380px">DEFI</div>
    <div class="zone" style="right:330px;top:270px">MEME</div>
    <div class="zone" style="left:850px;bottom:270px">TRADING</div>
    <div class="zone" style="right:190px;bottom:300px">NFT</div>

    <div id="worldNodes"></div>

  </div>
</div>

<div id="feed">
  <div class="feed-title">LIVE FEED</div>
  <div id="feedItems"></div>
</div>

<div id="panel">
  <div class="panel-title">SOLANA OBJECT</div>
  <div id="panelContent" class="panel-content"></div>
</div>

<div id="status">
  DRAG TO EXPLORE • SCROLL TO ZOOM
</div>

<script>

const space = document.getElementById("space");
const world = document.getElementById("world");
const canvas = document.getElementById("connections");
const ctx = canvas.getContext("2d");

const worldNodes = document.getElementById("worldNodes");
const feedItems = document.getElementById("feedItems");

const activity = document.getElementById("activity");
const walletCount = document.getElementById("walletCount");
const txCount = document.getElementById("txCount");

const panel = document.getElementById("panel");
const panelContent = document.getElementById("panelContent");

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let dragging = false;
let startX = 0;
let startY = 0;
let startOffsetX = 0;
let startOffsetY = 0;

let touchDistance = 0;
let touchScale = 1;

const walletMap = new Map();
const transactions = [];

function resizeCanvas(){
  canvas.width = world.clientWidth;
  canvas.height = world.clientHeight;
  drawConnections();
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();

function applyCamera(){
  space.style.transform =
    `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
}

space.addEventListener("mousedown",e=>{
  if(e.target.closest(".wallet,.tx")) return;

  dragging=true;

  startX=e.clientX;
  startY=e.clientY;

  startOffsetX=offsetX;
  startOffsetY=offsetY;

  space.classList.add("dragging");
});

window.addEventListener("mousemove",e=>{
  if(!dragging)return;

  offsetX=startOffsetX+(e.clientX-startX);
  offsetY=startOffsetY+(e.clientY-startY);

  applyCamera();
});

window.addEventListener("mouseup",()=>{
  dragging=false;
  space.classList.remove("dragging");
});

space.addEventListener("wheel",e=>{
  e.preventDefault();

  scale*=e.deltaY>0?.9:1.1;

  scale=Math.max(.45,Math.min(2.5,scale));

  applyCamera();
},{passive:false});

space.addEventListener("touchstart",e=>{

  if(e.touches.length===1){

    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;

    startOffsetX=offsetX;
    startOffsetY=offsetY;

  }

  if(e.touches.length===2){

    touchDistance=getDistance(e);
    touchScale=scale;

  }

},{passive:false});


space.addEventListener("touchmove",e=>{

  if(e.touches.length===1){

    e.preventDefault();

    offsetX=
      startOffsetX+
      (e.touches[0].clientX-startX);

    offsetY=
      startOffsetY+
      (e.touches[0].clientY-startY);

    applyCamera();

  }

  if(e.touches.length===2){

    e.preventDefault();

    const distance=getDistance(e);

    if(touchDistance>0){

      scale=
        touchScale*
        (distance/touchDistance);

      scale=
        Math.max(
          .45,
          Math.min(2.5,scale)
        );

      applyCamera();

    }

  }

},{passive:false});


space.addEventListener("touchend",e=>{

  if(e.touches.length===1){

    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;

    startOffsetX=offsetX;
    startOffsetY=offsetY;

  }

});


function getDistance(e){

  const dx=
    e.touches[0].clientX-
    e.touches[1].clientX;

  const dy=
    e.touches[0].clientY-
    e.touches[1].clientY;

  return Math.sqrt(
    dx*dx+dy*dy
  );

}

function shortAddress(address){

  if(!address)return "";

  return address.slice(0,5)+"..."+address.slice(-4);
}

function positionWallet(address){

  const angle=
    Math.random()*Math.PI*2;

  const radius=
    180+Math.random()*380;

  const centerX=900;
  const centerY=550;

  let x=
    centerX+
    Math.cos(angle)*radius;

  let y=
    centerY+
    Math.sin(angle)*radius;

  x=Math.max(50,Math.min(1750,x));
  y=Math.max(50,Math.min(1050,y));

  return {x,y};
}

function createWallet(address){

  if(walletMap.has(address)){
    return walletMap.get(address);
  }

  const pos=positionWallet(address);

  const el=document.createElement("div");

  el.className="wallet real";

  el.style.left=pos.x+"px";
  el.style.top=pos.y+"px";

  el.dataset.address=address;
  el.dataset.type="REAL WALLET";

  const label=document.createElement("div");

  label.className="wallet-label";

  label.textContent=
    shortAddress(address);

  el.appendChild(label);

  worldNodes.appendChild(el);

  const wallet={
    address,
    x:pos.x,
    y:pos.y,
    el
  };

  walletMap.set(address,wallet);

  el.addEventListener("click",e=>{

    e.stopPropagation();

    openWallet(address);

  });

  walletCount.textContent=walletMap.size;

  return wallet;
}

function openWallet(address){

  panel.style.display="block";

  panelContent.innerHTML=
    "<b>TYPE</b><br>"+
    "REAL SOLANA WALLET"+
    "<br><br>"+
    "<b>ADDRESS</b><br>"+
    address;

}

function openTransaction(signature,wallets){

  panel.style.display="block";

  panelContent.innerHTML=
    "<b>TYPE</b><br>"+
    "REAL SOLANA TRANSACTION"+
    "<br><br>"+
    "<b>SIGNATURE</b><br>"+
    signature+
    "<br><br>"+
    "<b>ACCOUNTS</b><br>"+
    wallets.length;

}

document.addEventListener("click",e=>{

  if(
    !e.target.closest(".wallet") &&
    !e.target.closest(".tx") &&
    !e.target.closest("#panel")
  ){
    panel.style.display="none";
  }

});

function createTransaction(tx){

  const wallets=
    (tx.wallets||[])
    .filter(Boolean);

  if(!wallets.length)return;

  const walletObjects=
    wallets.map(createWallet);

  const existing=
    transactions.find(
      t=>t.signature===tx.signature
    );

  if(existing)return;

  const first=
    walletObjects[0];

  const last=
    walletObjects[
      Math.min(1,walletObjects.length-1)
    ];

  const x=
    (first.x+last.x)/2;

  const y=
    (first.y+last.y)/2;

  const el=document.createElement("div");

  el.className="tx";

  el.style.left=x+"px";
  el.style.top=y+"px";

  const label=document.createElement("div");

  label.className="tx-label";

  label.textContent=
    "TX "+shortAddress(tx.signature);

  el.appendChild(label);

  worldNodes.appendChild(el);

  el.addEventListener("click",e=>{

    e.stopPropagation();

    openTransaction(
      tx.signature,
      wallets
    );

  });

  transactions.push({
    signature:tx.signature,
    wallets:walletObjects,
    el
  });

  txCount.textContent=transactions.length;

  addFeed(
    "REAL TX  "+shortAddress(tx.signature),
    true
  );

  createPulse(x,y);

  // Moving transaction particle
  if(walletObjects.length>=2){

    const particle=
      document.createElement("div");

    particle.style.position="absolute";
    particle.style.width="5px";
    particle.style.height="5px";
    particle.style.borderRadius="50%";
    particle.style.background="#ffffff";
    particle.style.boxShadow=
      "0 0 8px #ffffff, 0 0 18px #a56bff";
    particle.style.pointerEvents="none";
    particle.style.zIndex="20";

    worldNodes.appendChild(particle);

    const a=first;
    const b=last;

    const duration=
      900+Math.random()*900;

    const start=
      performance.now();

    function animateParticle(now){

      const progress=
        Math.min(
          (now-start)/duration,
          1
        );

      const eased=
        progress<0.5
          ?2*progress*progress
          :1-Math.pow(-2*progress+2,2)/2;

      const px=
        a.x+
        (b.x-a.x)*eased;

      const py=
        a.y+
        (b.y-a.y)*eased;

      particle.style.left=
        px+"px";

      particle.style.top=
        py+"px";

      particle.style.transform=
        `scale(${1+Math.sin(progress*Math.PI)*1.5})`;

      if(progress<1){

        requestAnimationFrame(
          animateParticle
        );

      }else{

        particle.remove();

        createPulse(
          b.x,
          b.y
        );

      }

    }

    requestAnimationFrame(
      animateParticle
    );

  }

}

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.lineWidth=1;

  transactions.forEach(tx=>{

    const wallets=tx.wallets;

    if(wallets.length<2)return;

    for(
      let i=0;
      i<wallets.length-1;
      i++
    ){

      const a=wallets[i];
      const b=wallets[i+1];

      ctx.beginPath();

      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);

      ctx.strokeStyle=
        "rgba(164,105,255,.22)";

      ctx.stroke();

    }

  });

}

function addFeed(text,real=false){

  const item=
    document.createElement("div");

  item.className=
    "feed-item"+
    (real?" real":"");

  item.textContent=text;

  feedItems.prepend(item);

  while(feedItems.children.length>7){

    feedItems.lastChild.remove();

  }

}

function createPulse(x,y){

  const pulse=
    document.createElement("div");

  pulse.className="network-pulse";

  pulse.style.left=x+"px";
  pulse.style.top=y+"px";

  worldNodes.appendChild(pulse);

  setTimeout(()=>{
    pulse.remove();
  },2600);

}

async function loadSolana(){

  activity.textContent="LOADING";

  try{

    const response=
      await fetch("/api/solana");

    if(!response.ok){

      throw new Error(
        "API "+response.status
      );

    }

    const data=
      await response.json();

    if(!data.success){

      throw new Error(
        "RPC ERROR"
      );

    }

    const txs=
      data.transactions||[];

    txs.forEach(createTransaction);

    activity.textContent=
      txs.length+" LIVE TX";

    walletCount.textContent=
      walletMap.size;

    txCount.textContent=
      transactions.length;

    drawConnections();

  }catch(error){

    console.error(error);

    activity.textContent="ERROR";

    addFeed(
      "RPC CONNECTION ERROR"
    );

  }

}

addFeed(
  "SOLANA WORLD INITIALIZED"
);

addFeed(
  "CONNECTING TO SOLANA MAINNET..."
);

addFeed(
  "WAITING FOR REAL NETWORK ACTIVITY..."
);

loadSolana();

setInterval(
  loadSolana,
  15000
);

</script>

</body>
</html>
