<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solana World</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #030306;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  position: relative;
}

#space {
  position: absolute;
  width: 100%;
  height: 100%;
  transform-origin: center center;
  cursor: grab;
}

#space.dragging {
  cursor: grabbing;
}

#world {
  position: absolute;
  width: 1800px;
  height: 1100px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

#connectionLayer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

header {
  position: fixed;
  top: 25px;
  left: 28px;
  z-index: 50;
  pointer-events: none;
}

.logo {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 4px;
}

.subtitle {
  margin-top: 6px;
  font-size: 10px;
  letter-spacing: 3px;
  color: #777;
}

.live {
  margin-top: 13px;
  font-size: 9px;
  letter-spacing: 2px;
  color: #52ff91;
}

.live::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 7px;
  border-radius: 50%;
  background: #52ff91;
  box-shadow: 0 0 10px #52ff91;
}

#networkInfo {
  position: fixed;
  right: 28px;
  top: 25px;
  z-index: 50;
  text-align: right;
  font-size: 9px;
  letter-spacing: 2px;
  color: #777;
  line-height: 1.9;
  pointer-events: none;
}

#networkInfo span {
  color: #ddd;
}

.activity-cluster {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  opacity: .35;
  filter: blur(1px);
}

.activity-cluster::after {
  content: "";
  position: absolute;
  inset: 25%;
  border-radius: 50%;
  background: rgba(255,255,255,.025);
}

.cluster-defi {
  width: 420px;
  height: 420px;
  left: 120px;
  top: 180px;
  background: radial-gradient(circle, rgba(123,77,255,.16), transparent 68%);
}

.cluster-meme {
  width: 360px;
  height: 360px;
  right: 180px;
  top: 110px;
  background: radial-gradient(circle, rgba(255,73,177,.13), transparent 68%);
}

.cluster-trading {
  width: 400px;
  height: 400px;
  left: 650px;
  bottom: 70px;
  background: radial-gradient(circle, rgba(0,183,255,.11), transparent 68%);
}

.cluster-nft {
  width: 330px;
  height: 330px;
  right: 70px;
  bottom: 100px;
  background: radial-gradient(circle, rgba(68,255,153,.09), transparent 68%);
}

.zone-label {
  position: absolute;
  font-size: 8px;
  letter-spacing: 3px;
  color: rgba(255,255,255,.22);
}

.node {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 10;
  transition: transform .2s;
}

.node:hover {
  transform: scale(1.8);
}

.wallet {
  background: #a56bff;
  box-shadow: 0 0 12px rgba(165,107,255,.8), 0 0 35px rgba(165,107,255,.25);
}

.token {
  width: 15px;
  height: 15px;
  background: #53ff91;
  box-shadow: 0 0 13px rgba(83,255,145,.8), 0 0 40px rgba(83,255,145,.2);
}

.tx {
  width: 9px;
  height: 9px;
  background: #ff9d42;
  box-shadow: 0 0 15px rgba(255,157,66,.95), 0 0 35px rgba(255,157,66,.4);
}

.dynamic-node {
  position: absolute;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  z-index: 7;
  cursor: pointer;
}

.dynamic-wallet {
  background: #9f63ff;
  box-shadow: 0 0 10px rgba(159,99,255,.8);
}

.dynamic-token {
  width: 12px;
  height: 12px;
  background: #55ff91;
  box-shadow: 0 0 12px rgba(85,255,145,.85);
}

.real-tx {
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ff9b3d;
  box-shadow: 0 0 13px #ff9b3d, 0 0 30px rgba(255,155,61,.5);
  z-index: 12;
  animation: txPulse 1.5s ease-in-out infinite;
}

@keyframes txPulse {
  0%,100% { transform: scale(.8); opacity: .6; }
  50% { transform: scale(1.7); opacity: 1; }
}

.tx-label {
  position: absolute;
  left: 12px;
  top: -5px;
  white-space: nowrap;
  font-size: 7px;
  letter-spacing: 1px;
  color: rgba(255,180,100,.75);
}

#feed {
  position: fixed;
  left: 28px;
  bottom: 25px;
  width: 300px;
  z-index: 50;
  pointer-events: none;
}

.feed-title {
  font-size: 8px;
  letter-spacing: 3px;
  color: #666;
  margin-bottom: 8px;
}

.feed-item {
  font-size: 9px;
  color: #aaa;
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.feed-item strong {
  color: #eee;
}

#panel {
  position: fixed;
  right: 28px;
  bottom: 25px;
  width: 290px;
  padding: 17px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(7,7,12,.88);
  backdrop-filter: blur(12px);
  z-index: 60;
  display: none;
}

.panel-title {
  font-size: 9px;
  color: #777;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.panel-value {
  font-size: 10px;
  line-height: 1.6;
  color: #ddd;
  word-break: break-all;
}

#status {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  z-index: 50;
  font-size: 8px;
  letter-spacing: 2px;
  color: #555;
  pointer-events: none;
}

.network-pulse {
  position: absolute;
  width: 30px;
  height: 30px;
  border: 1px solid rgba(160,100,255,.55);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  animation: pulse 2.5s ease-out forwards;
  pointer-events: none;
}

@keyframes pulse {
  0% {
    opacity: .8;
    transform: translate(-50%, -50%) scale(.2);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(8);
  }
}

@media (max-width: 700px) {
  header {
    top: 17px;
    left: 18px;
  }

  #networkInfo {
    top: 17px;
    right: 18px;
  }

  #feed {
    left: 18px;
    bottom: 18px;
    width: 230px;
  }

  #panel {
    right: 18px;
    bottom: 18px;
    width: 250px;
  }

  #status {
    display: none;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SOLANA WORLD</div>
  <div class="subtitle">THE BLOCKCHAIN, ALIVE.</div>
  <div class="live">LIVE NETWORK</div>
</header>

<div id="networkInfo">
  NETWORK: <span>SOLANA</span><br>
  ACTIVITY: <span id="activity">CONNECTING</span><br>
  NODES: <span id="nodes">—</span>
</div>

<div id="space">
  <div id="world">

    <canvas id="connectionLayer"></canvas>

    <div class="activity-cluster cluster-defi"></div>
    <div class="activity-cluster cluster-meme"></div>
    <div class="activity-cluster cluster-trading"></div>
    <div class="activity-cluster cluster-nft"></div>

    <div class="zone-label" style="left:250px;top:380px;">DEFI</div>
    <div class="zone-label" style="right:340px;top:270px;">MEME</div>
    <div class="zone-label" style="left:850px;bottom:270px;">TRADING</div>
    <div class="zone-label" style="right:190px;bottom:300px;">NFT</div>

    <div class="node wallet" style="left:31%;top:35%;" data-type="WALLET" data-address="Demo wallet A"></div>
    <div class="node wallet" style="left:62%;top:48%;" data-type="WALLET" data-address="Demo wallet B"></div>

    <div class="node token" style="left:43%;top:28%;" data-type="TOKEN" data-address="Demo Token"></div>
    <div class="node token" style="left:73%;top:67%;" data-type="TOKEN" data-address="Demo Token 2"></div>

    <div class="node tx" style="left:51%;top:42%;" data-type="TRANSACTION" data-address="Demo transaction"></div>

    <div id="dynamicWorld"></div>

  </div>
</div>

<div id="feed">
  <div class="feed-title">LIVE FEED</div>
  <div id="feedItems"></div>
</div>

<div id="panel">
  <div class="panel-title">OBJECT</div>
  <div id="panelContent" class="panel-value"></div>
</div>

<div id="status">DRAG TO EXPLORE • SCROLL TO ZOOM</div>

<script>
const space = document.getElementById("space");
const world = document.getElementById("world");
const dynamicWorld = document.getElementById("dynamicWorld");
const canvas = document.getElementById("connectionLayer");
const ctx = canvas.getContext("2d");

const activityEl = document.getElementById("activity");
const nodesEl = document.getElementById("nodes");
const feedItems = document.getElementById("feedItems");
const panel = document.getElementById("panel");
const panelContent = document.getElementById("panelContent");

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let dragging = false;
let startX = 0;
let startY = 0;
let startOffsetX = 0;
let startOffsetY = 0;

let touchStartDistance = 0;
let touchStartScale = 1;

const wallets = [];
const tokens = [];
const realTransactions = [];

function resizeCanvas() {
  canvas.width = world.clientWidth;
  canvas.height = world.clientHeight;
  drawConnections();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function applyCamera() {
  space.style.transform =
    `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}

space.addEventListener("mousedown", e => {
  if (e.target.closest(".node, .dynamic-node, .real-tx")) return;

  dragging = true;
  space.classList.add("dragging");

  startX = e.clientX;
  startY = e.clientY;

  startOffsetX = offsetX;
  startOffsetY = offsetY;
});

window.addEventListener("mousemove", e => {
  if (!dragging) return;

  offsetX = startOffsetX + (e.clientX - startX);
  offsetY = startOffsetY + (e.clientY - startY);

  applyCamera();
});

window.addEventListener("mouseup", () => {
  dragging = false;
  space.classList.remove("dragging");
});

space.addEventListener("wheel", e => {
  e.preventDefault();

  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale *= delta;
  scale = Math.max(.45, Math.min(2.5, scale));

  applyCamera();
}, { passive: false });

space.addEventListener("touchstart", e => {
  if (e.touches.length === 1) {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startOffsetX = offsetX;
    startOffsetY = offsetY;
  }

  if (e.touches.length === 2) {
    touchStartDistance = getTouchDistance(e.touches);
    touchStartScale = scale;
  }
}, { passive: false });

space.addEventListener("touchmove", e => {
  e.preventDefault();

  if (e.touches.length === 1) {
    offsetX = startOffsetX + (e.touches[0].clientX - startX);
    offsetY = startOffsetY + (e.touches[0].clientY - startY);
    applyCamera();
  }

  if (e.touches.length === 2) {
    const distance = getTouchDistance(e.touches);
    scale = touchStartScale * (distance / touchStartDistance);
    scale = Math.max(.45, Math.min(2.5, scale));
    applyCamera();
  }
}, { passive: false });

function getTouchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function randomPercent() {
  return {
    x: 5 + Math.random() * 90,
    y: 8 + Math.random() * 84
  };
}

function createSimulatedWorld() {
  for (let i = 0; i < 28; i++) {
    const p = randomPercent();

    const el = document.createElement("div");
    el.className = "dynamic-node dynamic-wallet";

    el.style.left = p.x + "%";
    el.style.top = p.y + "%";

    el.dataset.type = "WALLET";
    el.dataset.address = "Simulated wallet " + (i + 1);

    dynamicWorld.appendChild(el);

    wallets.push({
      el,
      x: p.x,
      y: p.y,
      vx: (Math.random() - .5) * .018,
      vy: (Math.random() - .5) * .018
    });
  }

  for (let i = 0; i < 10; i++) {
    const p = randomPercent();

    const el = document.createElement("div");
    el.className = "dynamic-node dynamic-token";

    el.style.left = p.x + "%";
    el.style.top = p.y + "%";

    el.dataset.type = "TOKEN";
    el.dataset.address = "Simulated token " + (i + 1);

    dynamicWorld.appendChild(el);

    tokens.push({
      el,
      x: p.x,
      y: p.y
    });
  }

  nodesEl.textContent = wallets.length + tokens.length;
}

function animateWorld() {
  wallets.forEach(w => {
    w.x += w.vx;
    w.y += w.vy;

    if (w.x < 2 || w.x > 98) w.vx *= -1;
    if (w.y < 5 || w.y > 95) w.vy *= -1;

    w.el.style.left = w.x + "%";
    w.el.style.top = w.y + "%";
  });

  drawConnections();

  requestAnimationFrame(animateWorld);
}

function drawConnections() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.lineWidth = 1;

  const points = wallets.slice(0, 18);

  for (let i = 0; i < points.length; i++) {
    for (let j = i + 1; j < points.length; j++) {
      const a = points[i];
      const b = points[j];

      const ax = a.x / 100 * canvas.width;
      const ay = a.y / 100 * canvas.height;
      const bx = b.x / 100 * canvas.width;
      const by = b.y / 100 * canvas.height;

      const dx = ax - bx;
      const dy = ay - by;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 330 && Math.random() > .82) {
        ctx.strokeStyle = "rgba(155,100,255,.13)";
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();
      }
    }
  }
}

function addFeed(text, important = false) {
  const item = document.createElement("div");
  item.className = "feed-item";

  if (important) {
    item.innerHTML = "<strong>" + text + "</strong>";
  } else {
    item.textContent = text;
  }

  feedItems.prepend(item);

  while (feedItems.children.length > 6) {
    feedItems.lastChild.remove();
  }
}

function openPanel(type, address) {
  panel.style.display = "block";

  panelContent.innerHTML =
    "<b>TYPE</b><br>" +
    type +
    "<br><br>" +
    "<b>ADDRESS</b><br>" +
    address;
}

document.querySelectorAll(".node, .dynamic-node").forEach(el => {
  el.addEventListener("click", e => {
    e.stopPropagation();

    openPanel(
      el.dataset.type || "OBJECT",
      el.dataset.address || "Unknown"
    );
  });
});

dynamicWorld.addEventListener("click", e => {
  const node = e.target.closest(".dynamic-node");

  if (!node) return;

  e.stopPropagation();

  openPanel(
    node.dataset.type,
    node.dataset.address
  );
});

document.querySelectorAll(".node").forEach(el => {
  el.addEventListener("click", e => {
    e.stopPropagation();

    openPanel(
      el.dataset.type,
      el.dataset.address
    );
  });
});

document.addEventListener("click", e => {
  if (!e.target.closest(".node, .dynamic-node, #panel")) {
    panel.style.display = "none";
  }
});

function createRealTransaction(signature, index) {
  const x = 10 + Math.random() * 80;
  const y = 10 + Math.random() * 80;

  const el = document.createElement("div");
  el.className = "real-tx";

  el.style.left = x + "%";
  el.style.top = y + "%";

  const label = document.createElement("div");
  label.className = "tx-label";
  label.textContent = "TX " + signature.slice(0, 6);

  el.appendChild(label);

  el.dataset.type = "REAL TRANSACTION";
  el.dataset.address = signature;

  dynamicWorld.appendChild(el);

  el.addEventListener("click", e => {
    e.stopPropagation();

    openPanel(
      "REAL TRANSACTION",
      signature
    );
  });

  realTransactions.push({
    el,
    signature
  });

  if (realTransactions.length > 20) {
    const old = realTransactions.shift();
    old.el.remove();
  }
}

async function loadSolanaData() {
  activityEl.textContent = "LOADING";

  try {
    const response = await fetch("/api/solana");

    if (!response.ok) {
      throw new Error("API " + response.status);
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error("Solana API error");
    }

    const transactions = data.transactions || [];

    activityEl.textContent =
      transactions.length + " TX";

    nodesEl.textContent =
      wallets.length + tokens.length + transactions.length;

    transactions.forEach((tx, index) => {
      if (
        !realTransactions.some(
          item => item.signature === tx.signature
        )
      ) {
        createRealTransaction(tx.signature, index);

        addFeed(
          "REAL TX  " + tx.signature.slice(0, 12) + "...",
          true
        );

        createPulse();
      }
    });

  } catch (error) {
    activityEl.textContent = "ERROR";

    addFeed("RPC CONNECTION ERROR");

    console.error(error);
  }
}

function createPulse() {
  const pulse = document.createElement("div");

  pulse.className = "network-pulse";

  pulse.style.left = (15 + Math.random() * 70) + "%";
  pulse.style.top = (15 + Math.random() * 70) + "%";

  dynamicWorld.appendChild(pulse);

  setTimeout(() => {
    pulse.remove();
  }, 2600);
}

function randomActivity() {
  createPulse();
}

createSimulatedWorld();
animateWorld();

addFeed("SOLANA WORLD INITIALIZED", true);
addFeed("CONNECTING TO MAINNET...");
addFeed("REAL RPC ONLINE");

loadSolanaData();

setInterval(loadSolanaData, 15000);
setInterval(randomActivity, 4500);

</script>

</body>
</html>
